<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Validação temporária da rota</title><meta name="robots" content="noindex,nofollow"><pre id="test">Verificando...</pre><script>
(async()=>{const results=[];const origin=[-46.4938778,-23.5532045];for(const [name,payload] of [["mapa",{"cep":"03583000","numero":"60","pin":[-46.4895,-23.5532]}],["endereco",{"cep":"03583000","numero":"60"}]]){try{const r=await fetch("/api/frete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});results.push({name,http:r.status,result:await r.json()})}catch(e){results.push({name,error:String(e)})}await new Promise(resolve=>setTimeout(resolve,4500))}document.getElementById("test").textContent=JSON.stringify(results,null,2)})();
</script></html>
